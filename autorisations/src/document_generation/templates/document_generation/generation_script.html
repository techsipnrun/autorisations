<script>
(() => {
    document.querySelectorAll('[data-copy-destination]').forEach(button=>button.addEventListener('click',async()=>{
        const path=button.dataset.copyDestination.replaceAll('/',String.fromCharCode(92));
        const feedback=button.parentElement.querySelector('[data-copy-destination-feedback]');
        try {
            if(navigator.clipboard?.writeText) await navigator.clipboard.writeText(path);
            else {
                const input=document.createElement('textarea');
                input.value=path;input.style.position='fixed';input.style.opacity='0';document.body.append(input);
                try {input.select();if(!document.execCommand('copy')) throw new Error('Copie impossible');}
                finally {input.remove();button.focus({preventScroll:true});}
            }
            feedback.textContent='Emplacement copié !';
        } catch(error) {feedback.textContent='Impossible de copier l’emplacement.';}
    }));
    window.showDocumentGenerationLoading=()=>{
        const overlay=document.querySelector('[data-generation-progress]');
        if(!overlay.open) overlay.showModal();
        document.body.style.overflow='hidden';
    };
    document.querySelector('[data-generation-progress]')?.addEventListener('cancel',event=>event.preventDefault());
    window.addEventListener('pageshow',event=>{
        if(event.persisted) {document.querySelector('[data-generation-progress]')?.close();document.body.style.overflow='';}
    });
    const scrollState=document.getElementById('generation-scroll-position');
    const position=scrollState ? JSON.parse(scrollState.textContent) : null;
    if(position) {
        const restore=()=>setTimeout(()=>window.scrollTo(position.x,position.y),0);
        if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',restore,{once:true});
        else restore();
    }
    const form=document.querySelector('#generation-form');
    if (!form) return;
    const conditions=JSON.parse(document.getElementById('generation-conditions').textContent || 'null') || {rules:{},values:{}};
    const truth=value=>Array.isArray(value) ? value.length>0 : value && typeof value==='object' ? Object.keys(value).length>0 : Boolean(value);
    function evaluate(rule,values) {
        if(!rule) return true;
        const [op,...args]=rule;
        if(op==='value') return values[args[0]] ?? null;
        if(op==='const') return args[0];
        if(op==='and') return args.every(arg=>truth(evaluate(arg,values)));
        if(op==='or') return args.some(arg=>truth(evaluate(arg,values)));
        if(op==='not') return !truth(evaluate(args[0],values));
        if(op==='compare') {
            let left=evaluate(args[0],values);
            for(const [kind,rightRule] of args[1]) {
                let right=evaluate(rightRule,values);
                if(typeof left==='boolean' && typeof right==='number') left=Number(left);
                if(typeof right==='boolean' && typeof left==='number') right=Number(right);
                const compatible=left!==null && right!==null && typeof left===typeof right;
                const result=kind==='eq' ? left===right : kind==='ne' ? left!==right : !compatible ? false :
                    kind==='gt' ? left>right : kind==='gteq' ? left>=right : kind==='lt' ? left<right : left<=right;
                if(!result) return false;
                left=right;
            }
            return true;
        }
        return true;
    }
    function refreshConditions() {
        const values={...conditions.values};
        const inputs=[...form.querySelectorAll('[data-balise-code]')];
        for(const input of inputs) {
            const code=input.dataset.baliseCode,type=input.dataset.baliseType;
            if(input.name.startsWith('known-') && (input.closest('.known-information')?.querySelector('[name^=edit_known_]') || form.querySelector('[name=edit_known]'))?.value!=='1') {
                if(['INTEGER','DECIMAL'].includes(type) && values[code]!==null && values[code]!==undefined) values[code]=Number(values[code]);
                continue;
            }
            values[code]=type==='BOOLEAN' ? (input.value==='' ? null : input.value==='true') :
                ['INTEGER','DECIMAL'].includes(type) ? (input.value==='' ? null : Number(input.value)) :
                type==='LIST' ? inputs.filter(item=>item.name===input.name).map(item=>item.value).filter(Boolean) : input.value;
        }
        for(const input of inputs) {
            const visible=truth(evaluate(conditions.rules[input.dataset.baliseCode],values));
            const row=input.closest('.field');
            if(row) row.hidden=!visible;
            input.disabled=!visible;
        }
        for(const value of form.querySelectorAll('[data-information-value]')) {
            value.closest('.information-value').hidden=!truth(evaluate(conditions.rules[value.dataset.code],values));
        }
    }
    function refreshValidity() {
        refreshConditions();
        const fields=[...form.querySelectorAll('input,select,textarea')];
        let valid=fields.filter(field=>!field.disabled).every(field=>field.validity.valid && (!field.required || field.value.trim()!==''));
        for(const group of form.querySelectorAll('[data-repeated-text]')) {
            if(group.closest('.field')?.hidden) continue;
            if(group.closest('[data-field-required="true"]') && ![...group.querySelectorAll('input')].some(input=>input.value.trim())) valid=false;
        }
        for(const field of form.querySelectorAll('[data-information-field]')) {
            if(field.hidden) continue;
            const inputs=[...field.querySelectorAll('input,select,textarea')].filter(input=>!input.disabled);
            const emptyList=field.dataset.fieldRequired==='true' && field.querySelector('[data-repeated-text]') && !inputs.some(input=>input.value.trim());
            const invalid=inputs.some(input=>!input.validity.valid || (input.required && !input.value.trim()));
            const incomplete=Boolean(emptyList || invalid);
            field.classList.toggle('needs-attention',incomplete);
            const hint=field.querySelector('[data-field-status]');
            if(hint) {
                hint.hidden=!incomplete;
                const text=inputs.some(input=>input.value.trim()) && !emptyList ? 'À corriger' : 'À renseigner';
                if(hint.textContent!==text) hint.textContent=text;
            }
        }
        for(const block of form.querySelectorAll('[data-information-block]')) {
            const missing=[...block.querySelectorAll('[data-information-field]')].some(row=>
                !row.hidden && !row.closest('[hidden]') && (()=>{
                    const inputs=[...row.querySelectorAll('input,select,textarea')].filter(input=>input.willValidate);
                    return inputs.length>0 && (inputs.some(input=>!input.validity.valid) || inputs.every(input=>!input.value.trim()));
                })()) ||
                [...block.querySelectorAll('[data-information-value]')].some(value=>!value.closest('[hidden]') && ['', '—'].includes(value.textContent.trim())) ||
                Boolean(block.querySelector('.output-variable.is-pending')) ||
                Boolean(block.querySelector('[name=number_selection]') && !block.querySelector('[name=number_selection]').value);
            block.classList.toggle('has-missing-information',missing);
        }
        const number=form.querySelector('[name=number_selection]');
        if(form.querySelector('.output-variable.is-pending:not([data-variable="document.numero"])')) valid=false;
        const filename=form.querySelector('[name=output_filename]');
        if(filename && !filename.value.replace(/\.docx$/i,'').trim()) valid=false;
        const numberControl=form.querySelector('[data-document-number]');
        if(numberControl) numberControl.hidden=!valid;
        if(number && !number.value) valid=false;
        if(form.querySelector('.output-variable.is-pending')) valid=false;
        document.querySelectorAll('[data-requires-valid-form]').forEach(button=>{button.disabled=!valid || form.getAttribute('aria-busy')==='true';});
        form.dataset.generationValid=String(valid);
        form.dispatchEvent(new Event('generation-validity'));
    }
    form.addEventListener('input',refreshValidity);
    form.addEventListener('change',refreshValidity);
    new MutationObserver(refreshValidity).observe(form,{childList:true,subtree:true,characterData:true});
    document.addEventListener('DOMContentLoaded',refreshValidity,{once:true});
    refreshValidity();
    form.querySelectorAll('[data-repeated-text]').forEach(group=>{
        const rows=group.querySelector('[data-repeated-rows]');
        const prototype=rows.firstElementChild.cloneNode(true);
        function renumber() {
            [...rows.children].forEach((row,index)=>{
                const number=index+1,input=row.querySelector('input');
                input.id=`${group.dataset.baseId}_${number}`;
                row.querySelector('label').htmlFor=input.id;
                row.querySelector('[data-row-number]').textContent=number;
                row.querySelector('[data-remove-row]').setAttribute('aria-label',`Supprimer ${group.dataset.itemLabel} ${number}`);
            });
            group.querySelector('[data-add-row]').disabled=rows.children.length>=100;
        }
        function add() {
            const row=prototype.cloneNode(true);row.querySelector('input').value='';rows.append(row);renumber();return row;
        }
        group.addEventListener('click',event=>{
            if(event.target.closest('[data-add-row]')) {
                if(rows.children.length<100) add().querySelector('input').focus();
            } else if(event.target.closest('[data-remove-row]')) {
                event.target.closest('.repeated-text-row').remove();
                if(!rows.children.length) add();
                renumber();rows.lastElementChild.querySelector('input').focus();
            }
        });
        renumber();
    });
    const flag=form.querySelector('[name="edit_known"]');
    const groups=[...form.querySelectorAll('.known-information')].map(block=>{
        const editor=block.querySelector('[data-known-editor]'),display=block.querySelector('[data-known-display]');
        const inputs=[...editor.querySelectorAll('input,select,textarea')];
        const groupFlag=block.querySelector('[name^=edit_known_]');
        return {block,editor,display,inputs,flag:groupFlag,pencil:block.querySelector('.edit-known'),
                saved:inputs.map(input=>input.value),active:groupFlag?.value==='1'};
    });
    const manualValues=()=>[...form.querySelectorAll('input,select,textarea')].filter(input=>input.name.startsWith('balise_') || ['number_selection','output_filename'].includes(input.name)).map(input=>[input.name,input.value]);
    const initialManual=JSON.stringify(manualValues());
    const initialKnown=groups.map(group=>group.inputs.map(input=>input.value));
    let leaving=false;
    const hasWork=()=>JSON.stringify(manualValues())!==initialManual || groups.some((group,index)=>group.flag?.value==='1' && group.inputs.some((input,i)=>input.value!==initialKnown[index][i]));
    window.confirmDocumentGenerationLeave=()=>{
        if(window.saveDocumentGenerationDraft?.()) {leaving=true;return true;}
        if(hasWork() && !window.confirm('Voulez-vous vraiment abandonner la g\u00e9n\u00e9ration en cours ?')) return false;
        leaving=true;window.setTimeout(()=>{leaving=false;},1000);return true;
    };
    function toggleEdition(group,editing) {
        group.pencil?.setAttribute('aria-expanded',String(editing));
        group.editor.hidden=!editing;group.display.hidden=editing;
        group.editor.querySelector('fieldset').disabled=!(editing || group.active);
        if(group.flag) group.flag.value=editing || group.active ? '1' : '0';
        flag.value=groups.some(item=>item.flag?.value==='1') ? '1' : '0';
        refreshValidity();if(editing) group.inputs[0]?.focus();
    }
    for(const group of groups) {
        const cancel=()=>{group.inputs.forEach((input,i)=>{input.value=group.saved[i];});toggleEdition(group,false);};
        group.pencil?.addEventListener('click',()=>group.pencil.getAttribute('aria-expanded')==='true' ? cancel() : toggleEdition(group,true));
        group.block.querySelector('[data-known-cancel]')?.addEventListener('click',cancel);
        group.block.querySelector('[data-known-save]')?.addEventListener('click',()=>{
            if(group.inputs.some(input=>!input.reportValidity())) return;
            group.saved=group.inputs.map(input=>input.value);group.active=true;
            group.display.querySelectorAll('dd').forEach(value=>{
                const input=group.inputs.find(input=>input.dataset.baliseCode===value.dataset.code);
                if(input) value.textContent=input.tagName==='SELECT' ? input.selectedOptions[0]?.textContent || '\u2014' : input.value || '\u2014';
            });
            toggleEdition(group,false);
        });
    }
    form.addEventListener('generation-draft-restored',()=>groups.forEach(group=>{
        group.active=group.flag?.value==='1';
        group.saved=group.inputs.map(input=>input.value);
    }));
    window.addEventListener('beforeunload', event => {
        if(window.saveDocumentGenerationDraft?.()) return;
        if (leaving || !hasWork()) return;
        event.preventDefault();
        event.returnValue='';
    });
    window.addEventListener('pageshow', () => {leaving=false;});
    document.addEventListener('click', event => {
        const link=event.target.closest('a[href]');
        if(link?.matches('.generation-return') && !event.defaultPrevented && event.button===0 && !event.ctrlKey && !event.metaKey && !event.shiftKey && !event.altKey) {
            if(!window.confirmDocumentGenerationLeave()) {event.preventDefault();return;}
            window.showDocumentGenerationLoading();return;
        }
        if (!link || event.defaultPrevented || event.button!==0 || event.ctrlKey || event.metaKey
            || event.shiftKey || event.altKey || link.target==='_blank' || link.hasAttribute('download')
            || link.getAttribute('href').startsWith('#') || !hasWork()) return;
        if(window.saveDocumentGenerationDraft?.()) {leaving=true;return;}
        if (!window.confirm('Voulez-vous vraiment abandonner la génération en cours ?')) {
            event.preventDefault();
        } else {
            leaving=true;
            window.setTimeout(() => {leaving=false;}, 1000);
        }
    });
    form.addEventListener('submit', event => {
        refreshValidity();
        if(event.submitter?.matches('[data-requires-valid-form]') && event.submitter.disabled) {event.preventDefault();return;}
        if(form.getAttribute('aria-busy')==='true') {event.preventDefault();return;}
        leaving=true;
        for(const [axis,value] of [['x',window.scrollX],['y',window.scrollY]]) {
            const state=document.createElement('input');state.type='hidden';state.name=`_scroll_${axis}`;state.value=Math.round(value);form.append(state);
        }
        if (event.submitter?.value==='generate_docx') {
            window.setTimeout(() => {leaving=false;}, 1000);
        }
        const hidden=document.createElement('input');hidden.type='hidden';hidden.name='action';hidden.value=event.submitter?.value || 'validate';
        form.append(hidden);
        document.querySelectorAll('#generation-form button, button[form="generation-form"]').forEach(button=>{button.disabled=true;});
        form.setAttribute('aria-busy','true');
        window.showDocumentGenerationLoading();
    });
    window.addEventListener('pageshow',event=>{
        if(!event.persisted) return;
        document.querySelector('[data-generation-progress]')?.close();
        document.body.style.overflow='';
        form.removeAttribute('aria-busy');
        document.querySelectorAll('#generation-form button, button[form="generation-form"]').forEach(button=>{button.disabled=false;});
        refreshValidity();
    });
})();
</script>

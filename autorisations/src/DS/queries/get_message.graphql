query dossier($number: Int!) {
  dossier(number: $number) {
    number

    usager {
      email
    }

    demandeur {
      __typename

      ... on PersonnePhysique {
        email
      }
    }

    instructeurs {
      email
    }

    messages {
      id
      email
      body
      createdAt

      attachments {
        url
        filename
      }
    }
  }
}
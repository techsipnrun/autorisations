{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar</title>
    <link rel="stylesheet" href="{% static 'instruction/css/navbar.css' %}">
</head>
<body>
    <header>
        <div class="navigation_header">

            <div class="logo-application">
                <a href="#">
                    <img class="logo_svg" src="{% static 'instruction/img/logoPNRUN.png' %}">
                </a>
            </div>            

            <div class="container-links">
                <ul class="navigation_links">

                    <a href="{% url 'preinstruction_view' %}">
                        <li class="{% if '/preinstruction' in request.path %}active{% endif %}">
                            Réception
                        </li>
                    </a>

                    <a href="{% url 'accueil_view' %}">
                        <li class="{% if '/instruction' in request.path %}active{% endif %}">
                            Instruction 
                        </li>
                    </a>

                    <a href="{% url 'mesdossiers_view' %}">
                        <li class="{% if '/mesdossiers' in request.path or request.path == '/' %}active{% endif %}">
                            Mes dossiers
                            {% if nb_dossiers_instruction > 0 %}
                                <span class="notif_pastille" title="Actions à faire">{{ nb_dossiers_instruction }}</span>
                            {% endif %}
                        </li>
                    </a>


                    <a href="{% url 'avis_view' %}">
                        <li class="{% if '/reception_avis' in request.path %}active{% endif %}">
                            Mes avis
                        </li>
                    </a>

                    <a href="{% url 'requetes_view' %}">
                        <li class="{% if request.path == '/requetes/' %}active{% endif %}">
                            Requêtes
                        </li>
                    </a>

                </ul>
            </div>
           
            
            <div class="user_information">
                <div class="user_dropdown">
                    <button class="user_toggle">
                        <strong>{{ user.email }}</strong>
                        <img src="{% static 'instruction/img/chevron-down.svg' %}" class="chevron" alt="Menu">
                    </button>

                    <div class="user_menu">
                        <form method="post" action="{% url 'logout' %}">
                            {% csrf_token %}
                            <button type="submit" class="logout-item">
                                <img src="{% static 'instruction/img/log-out.svg' %}" class="icon"> Se déconnecter
                            </button>
                        </form>
                    </div>
                </div>

                <div class="settings_dropdown">
                    <button class="settings_toggle" title="Paramètres">
                        <img src="{% static 'instruction/img/settings.svg' %}" class="setting_icon" alt="Paramètres">
                    </button>

                    <div class="settings_menu">
                        <a href="/admin/" class="dropdown-item" target="_blank">
                            <img src="{% static 'instruction/img/shield-user.svg' %}" class="icon" alt="">
                            <span>Admin</span>
                        </a>

                        <a href="/gestion_groupes/" target="_blank" class="dropdown-item">
                            <img src="{% static 'instruction/img/groups.svg' %}" class="icon" alt="">
                            <span>Gestion des groupes</span>
                        </a>

                        <a href="/swagger/" target="_blank" class="dropdown-item">
                            <img src="{% static 'instruction/img/api-icon.svg' %}" class="icon" alt="">
                            <span>API Swagger</span>
                        </a>
                        
                        <a href="https://www.demarches-simplifiees.fr/procedures" target="_blank" class="dropdown-item">
                            <img src="{% static 'instruction/img/DS_noir_et_blanc.svg' %}" class="icon" alt="">
                            <span>Démarches Simplifiées</span>
                        </a>

                        <a href="https://declaration-manifestations.gouv.fr/instructions/tableaudebord/50975/" target="_blank" class="dropdown-item">
                            <img src="{% static 'instruction/img/prefet_icon.svg' %}" class="icon" alt="">
                            <span>Déclaration Manifestations</span>
                        </a>
                    </div>
                </div>
            </div>


        </div>

    </header>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
        const dropdowns = Array.from(document.querySelectorAll('.user_dropdown, .settings_dropdown'));

        const closeAll = (except = null) => {
            dropdowns.forEach(d => {
            if (!except || d !== except) d.classList.remove('open');
            });
        };

        // Ouvre le menu cliqué et ferme tous les autres
        document.querySelectorAll('.user_toggle, .settings_toggle').forEach(btn => {
            btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const parent = btn.closest('.user_dropdown, .settings_dropdown');
            const willOpen = !parent.classList.contains('open');
            closeAll();                // ferme tout
            if (willOpen) parent.classList.add('open');  // (ré)ouvre seulement celui cliqué
            });
        });

        // Clic en dehors -> ferme tout
        document.addEventListener('click', () => closeAll());

        // Échap -> ferme tout (confort)
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeAll();
        });

        // Optionnel : éviter la fermeture si on clique *dans* le menu (les liens continuent de fonctionner)
        document.querySelectorAll('.user_menu, .settings_menu').forEach(menu => {
            menu.addEventListener('click', (e) => e.stopPropagation());
        });
        });
    </script>



</body>
</html>

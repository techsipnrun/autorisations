{% if dossier.present_sur_ds %}
<button type="button" class="btn_dropdown_instruction" data-archive-action="accepte" data-ouvrir-formulaire="{{ action.code }}">Archiver le dossier comme accepté</button>
{% else %}
<form method="post" data-archive-action="accepte" action="{% url 'classer_le_dossier_comme_accepte_url' %}" id="form-retour-instruction-2">
{% csrf_token %}
<input type="hidden" name="dossierId" value="{{ dossier.id_ds }}">
<button type="button" class="btn_dropdown_instruction" data-confirmer-action="Confirmez-vous le classement du dossier comme accepté ?">Archiver le dossier comme accepté</button>
</form>
{% endif %}

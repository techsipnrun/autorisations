<div id="{% if interface == 'preinstruction' %}formulaire-refus-direct{% else %}formulaire-refus{% endif %}" data-action-form="{{ action.code }}" class="zone-complement zone-envoyer-pour-validation">
    <form method="post" enctype="multipart/form-data" action="{% url 'classer_le_dossier_comme_refuse_url' %}" onsubmit="return confirm('Confirmez-vous le classement du dossier comme refusé ?');">
        {% csrf_token %}
        <input type="hidden" name="dossierId" value="{{ dossier.id_ds }}">
        <div class="instruction-warning">
            <strong>Attention :</strong> l’utilisation de ce raccourci d’archivage doit avoir été vue et accordée par le valideur.
        </div>
        <p style="font-style: italic">Ce message sera visible par le pétitionnaire sur son espace Démarche Numérique.</p>{% if interface != 'preinstruction' %} <br>{% endif %}
        <textarea name="motivation" class="textarea-complement"{% if interface != 'preinstruction' %} placeholder="Justification du refus auprès du pétitionnaire..."{% endif %} required>[Donner les motifs de refus]

L’établissement du Parc national de La Réunion ne peut donner une suite favorable à votre demande.</textarea>

        <div class="zone-pj-complement">
            <label for="justificatif-refus{% if interface == 'preinstruction' %}-preinstruction{% endif %}">Joindre un justificatif (facultatif) :</label>
            <input id="justificatif-refus{% if interface == 'preinstruction' %}-preinstruction{% endif %}" type="file" name="justificatif" data-taille-max="10485760">
            <small class="aide-taille-justificatif">Taille maximale : 10 Mo</small>
            <button type="submit" class="btn-envoyer-complement">Confirmer le refus</button>
        </div>
    </form>
</div>

{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion</title>
    <link rel="stylesheet" href="{% static 'authent/css/login.css' %}">

    <!-- Icon -->
    <link rel="icon" type="image/x-icon" href="{% static 'instruction/img/favicon.ico' %}">
    
</head>
<body>
    <div class="login-container">

        <div class="logo-container">
            <img src="{% static 'instruction/img/agida_logo.png' %}" alt="AGIDA" class="logo-agida">
        </div>

        <h2>Connexion</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Se connecter</button>
        </form>
        <p>Pas encore inscrit ? Contacter l'administrateur</p>
    </div>
</body>
</html>
